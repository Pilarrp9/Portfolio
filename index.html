  "sameAs": ["https://www.linkedin.com/in/pilar-ramirez-palacios-a42970223/"]

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #14102b;
    --navy-deep: #0c0920;
    --cream: #f7ecda;
    --amber: #e8a33d;
    --amber-soft: #f0c078;
    --rose: #c9714f;
    --sage: #8aab7c;
    --ink: #241c3d;
    --panel: #1d1740;
    --panel-line: rgba(247,236,218,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--navy-deep);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    height:100vh;
    width:100vw;
    overflow:hidden;
    position:relative;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- BOTTOM OVERLAY BAR ---------- */
  .bottom-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:20;
    padding: 54px 28px 16px;
    background: linear-gradient(to top, rgba(6,5,16,0.88) 0%, rgba(6,5,16,0.6) 45%, transparent 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    pointer-events:none;
  }
  .bottom-bar .row{
    width:100%;
    max-width:1500px;
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }
  .bottom-bar h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(28px, 4vw, 42px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
    pointer-events:none;
  }
  .bottom-bar .role{
    margin:0;
    color: var(--amber-soft);
    font-size:16px;
    font-weight:500;
    pointer-events:none;
    white-space:nowrap;
  }
  .bottom-bar .role .l2{
    display:block;
    font-size:14px;
    margin-top:2px;
  }
  .scene-hint{
    text-align:center;
    font-size:12.5px;
    color: rgba(247,236,218,0.62);
    font-weight:500;
    pointer-events:none;
  }
  .scene-hint b{
    color: rgba(240,192,120,0.55);
    font-weight:600;
  }
  .quick-contact{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:700;
    color: var(--ink);
    background: var(--amber);
    border:none;
    padding: 8px 15px;
    border-radius:999px;
    cursor:pointer;
    transition: background .15s ease, transform .15s ease;
    pointer-events:auto;
    flex:none;
  }
  .quick-contact:hover, .quick-contact:focus-visible{
    background: var(--amber-soft);
    transform: translateY(-1px);
  }
  .bottom-bar .row > div:first-child{
    min-width:0;
  }
  .legend{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
    pointer-events:none;
  }
  .legend button{
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    color: var(--cream);
    background: rgba(247,236,218,0.1);
    border: 1px solid rgba(247,236,218,0.22);
    padding: 6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
    pointer-events:auto;
  }
  .legend button:hover, .legend button:focus-visible{
    background: rgba(232,163,61,0.24);
    border-color: var(--amber);
  }

  /* ---------- SCENE ---------- */
  .scene-wrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .scene{
    position:relative;
    width:100%;
    height:100%;
  }
  .scene img.base{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .scene svg.overlay{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  .hotspot{
    cursor:pointer;
    outline:none;
    transition: filter .15s ease;
  }
  .hotspot:focus-visible{
    filter: drop-shadow(0 0 0 3px var(--amber));
  }
  .hole{
    transition: opacity .35s cubic-bezier(.22,.8,.32,1);
  }

  .room-label{
    position:absolute;
    transform: translate(-50%, -50%) translateY(6px);
    padding: 6px 14px;
    background: rgba(20,16,43,0.88);
    border: 1px solid rgba(247,236,218,0.25);
    border-radius: 999px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 15px;
    color: var(--cream);
    white-space:nowrap;
    pointer-events:none;
    opacity:0;
    transition: opacity .25s ease, transform .25s ease;
    letter-spacing: 0.01em;
  }
  .room-label.visible{
    opacity:1;
    transform: translate(-50%, -50%) translateY(-4px);
  }
  .room-label .n{
    color:var(--amber-soft);
    font-weight:400;
    font-size:12px;
    display:block;
    font-family:'Inter',sans-serif;
    margin-top:1px;
  }

  .sound-toggle{
    position:fixed;
    top:20px; right:20px;
    z-index:30;
    width:44px; height:44px;
    border-radius:50%;
    border:1.5px solid rgba(247,236,218,0.22);
    background:rgba(20,16,43,0.72);
    backdrop-filter:blur(4px);
    color:var(--cream);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .sound-toggle:hover, .sound-toggle:focus-visible{
    border-color:var(--amber);
    background:rgba(232,163,61,0.18);
  }
  .sound-toggle.on{
    color:var(--amber-soft);
    border-color:rgba(232,163,61,0.4);
  }

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background: rgba(8,6,20,0.72);
    backdrop-filter: blur(3px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease;
    z-index:50;
  }
  .modal-backdrop.open{
    opacity:1;
    pointer-events:auto;
  }
  .modal{
    background: var(--panel);
    border: 1px solid rgba(247,236,218,0.14);
    border-radius: 20px;
    max-width: 720px;
    width:100%;
    max-height: 86vh;
    overflow-y:auto;
    padding: 34px 34px 30px;
    transform: translateY(14px) scale(.98);
    transition: transform .25s cubic-bezier(.22,.8,.32,1), max-width .2s ease;
    position:relative;
  }
  .modal.wide{
    max-width: 960px;
  }
  .modal.tall{
    min-height: 580px;
  }
  .modal-backdrop.open .modal{
    transform: translateY(0) scale(1);
  }
  .modal h2{
    font-family:'Fraunces', serif;
    font-size: 30px;
    font-weight:600;
    margin: 0 0 14px;
  }
  .modal-close{
    position:absolute;
    top:20px; right:20px;
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--panel-line);
    background: rgba(247,236,218,0.06);
    color: var(--cream);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover, .modal-close:focus-visible{ background: rgba(232,163,61,0.2); border-color:var(--amber);}
  .modal p{ line-height:1.65; font-size:15px; color: rgba(247,236,218,0.9); margin: 0 0 14px;}

  .stat-row{ display:flex; flex-wrap:wrap; gap:10px; margin: 4px 0 18px;}
  .stat-chip{
    background: rgba(232,163,61,0.1);
    border:1px solid rgba(232,163,61,0.3);
    color: var(--amber-soft);
    font-size:13px;
    font-weight:600;
    padding:6px 12px;
    border-radius:10px;
  }

  .xp-bar-wrap{ margin: 4px 0 18px;}
  .xp-label{ display:flex; justify-content:space-between; font-size:12px; color:rgba(247,236,218,.6); margin-bottom:5px;}
  .xp-track{ height:8px; background:rgba(247,236,218,0.1); border-radius:99px; overflow:hidden;}
  .xp-fill{ height:100%; background: linear-gradient(90deg, var(--rose), var(--amber)); border-radius:99px; width:77.5%;}

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .chip{ font-size:12.5px; background:rgba(247,236,218,0.07); border:1px solid var(--panel-line); padding:5px 11px; border-radius:999px; color:rgba(247,236,218,.85);}

  .char-row{ display:flex; gap:18px; align-items:center; margin-bottom:20px;}
  .avatar-placeholder{
    width:76px; height:76px; border-radius:50%; flex-shrink:0;
    background: linear-gradient(135deg, var(--rose), var(--amber));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:27px; color:var(--ink);
    box-shadow: 0 10px 24px -8px rgba(232,163,61,.55);
    overflow:hidden;
  }
  .avatar-placeholder img{ width:100%; height:100%; object-fit:cover; display:block;}
  .char-info{ flex:1; min-width:0;}
  .level-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; color:var(--amber-soft);
    background: rgba(232,163,61,0.12); border:1px solid rgba(232,163,61,0.3);
    padding:5px 12px; border-radius:999px; margin-bottom:9px;
  }
  .level-badge .u{ opacity:.65; font-weight:500;}

  .proj-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:6px;}
  @media (max-width:560px){ .proj-grid{grid-template-columns:1fr 1fr;} }
  .proj-card{
    aspect-ratio:1/1;
    border:1.5px dashed rgba(247,236,218,0.2);
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-size:12px;
    color: rgba(247,236,218,0.4);
    padding:10px;
  }

  form.contact-form{ display:flex; flex-direction:column; gap:12px; margin-top:8px;}
  form.contact-form label{ font-size:12.5px; font-weight:600; color:var(--amber-soft); margin-bottom:4px; display:block;}
  form.contact-form input, form.contact-form select, form.contact-form textarea{
    width:100%;
    background: rgba(247,236,218,0.05);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:10px 12px;
    color:var(--cream);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  form.contact-form textarea{ min-height:90px; resize:vertical;}
  form.contact-form button{
    margin-top:4px;
    background: var(--amber);
    color: var(--ink);
    border:none;
    font-weight:700;
    font-size:14px;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    transition: background .15s ease;
  }
  form.contact-form button:hover{ background: var(--amber-soft); }
  .form-note{ font-size:12px; color:rgba(247,236,218,.5); margin-top:2px;}
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}

  /* ---------- VALORES: flip cards ---------- */
  .vflip-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:6px;}
  @media (min-width:760px){ .vflip-grid{ grid-template-columns:repeat(3,1fr);} }
  @media (max-width:520px){ .vflip-grid{grid-template-columns:1fr;} }
  .vflip-card{ height:150px; perspective:800px; cursor:pointer; outline:none;}
  .vflip-card:focus-visible .vflip-inner{ box-shadow:0 0 0 3px var(--amber); border-radius:14px;}
  .vflip-inner{ width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,0,.2,1); border-radius:14px;}
  .vflip-card:hover .vflip-inner, .vflip-card.flipped .vflip-inner{ transform:rotateY(180deg);}
  .vflip-front, .vflip-back{ position:absolute; inset:0; border-radius:14px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; padding:16px 18px; background:rgba(247,236,218,0.045); border:1.5px solid var(--panel-line);}
  .vflip-back{ transform:rotateY(180deg); justify-content:flex-start;}
  .vflip-icon{ font-size:22px; margin-bottom:7px;}
  .vflip-title{ font-family:'Fraunces',serif; font-size:14.5px; font-weight:700; line-height:1.25; margin-bottom:3px;}
  .vflip-sub{ font-size:11.5px; color:rgba(247,236,218,.55);}
  .vflip-hint{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--amber-soft); margin-top:auto;}
  .vflip-tag{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;}
  .vflip-desc{ font-size:12.5px; color:rgba(247,236,218,.85); line-height:1.6;}

  /* ---------- COMPETENCIAS: buscador + filtros + pills ---------- */
  .comp-hint{ font-size:13.5px; color:rgba(247,236,218,.55); margin:0 0 16px; line-height:1.5;}
  .comp-controls{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .comp-search{ flex:1; min-width:180px; display:flex; align-items:center; gap:9px; background:rgba(247,236,218,0.05); border:1.5px solid var(--panel-line); border-radius:22px; padding:10px 16px; transition:border-color .2s;}
  .comp-search:focus-within{ border-color:var(--amber);}
  .comp-search input{ border:none; background:transparent; outline:none; color:var(--cream); font-family:'Inter',sans-serif; font-size:14.5px; width:100%;}
  .comp-chips{ display:flex; gap:7px; flex-wrap:wrap;}
  .comp-chip{ display:inline-flex; align-items:center; justify-content:center; line-height:1; gap:5px; font-size:12.5px; font-weight:700; padding:9px 15px; border-radius:20px; border:1.5px solid var(--panel-line); background:transparent; color:rgba(247,236,218,.75); cursor:pointer;}
  .comp-chip.active{ background:var(--cream); color:var(--ink); border-color:var(--cream);}
  .comp-chip:focus-visible{ outline:2px solid var(--amber); outline-offset:1px;}
  .comp-grid{ display:flex; flex-wrap:wrap; gap:9px; min-height:36px;}
  .comp-pill{ display:inline-flex; align-items:center; justify-content:center; line-height:1; font-size:14.5px; font-weight:700; padding:10px 18px; border-radius:22px; cursor:pointer; border:1.5px solid transparent; transition:transform .15s;}
  .comp-pill:hover{ transform:translateY(-2px);}
  .comp-pill:focus-visible{ outline:2px solid var(--amber); outline-offset:1px;}
  .comp-pill.hide{ display:none;}
  .comp-empty{ font-size:13.5px; color:rgba(247,236,218,.68); display:none; margin-top:6px;}

  /* popup secundario (detalle de herramienta) */
  .popup-backdrop{ position:fixed; inset:0; background:rgba(6,5,16,0.55); border-radius:20px; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:60; overflow:hidden;}
  .popup-backdrop.open{ opacity:1; pointer-events:auto;}
  .popup{ background:var(--panel); border:1px solid var(--panel-line); border-radius:20px; max-width:320px; width:100%; padding:26px 24px; position:relative; transform:scale(.92) translateY(8px); opacity:0; transition:transform .3s cubic-bezier(.16,1,.3,1), opacity .25s ease;}
  .popup-backdrop.open .popup{ transform:scale(1) translateY(0); opacity:1;}
  .popup-close{ position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; border:1px solid var(--panel-line); background:rgba(247,236,218,0.06); color:var(--cream); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .popup-close:hover{ background:rgba(232,163,61,0.2); border-color:var(--amber);}
  .popup-icon{ width:46px; height:46px; display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom:10px;}
  .popup-badge{ display:inline-flex; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:4px 11px; border-radius:20px; margin-bottom:12px;}
  .popup-title{ font-family:'Fraunces',serif; font-size:19px; font-weight:700; margin-bottom:10px;}
  .popup-stars{ display:flex; gap:4px; margin-bottom:5px;}
  .popup-stars span{ font-size:20px; color:rgba(247,236,218,.15); transform:scale(.5); opacity:0; transition:color .3s, transform .25s, opacity .25s;}
  .popup-stars span.on{ color:var(--amber);}
  .popup-lvl{ font-size:11px; color:rgba(247,236,218,.55); font-weight:600; margin-bottom:14px;}
  .popup-desc{ font-size:13px; color:rgba(247,236,218,.85); line-height:1.6; border-top:1px solid var(--panel-line); padding-top:12px;}

  /* ---------- EXPERIENCIA: raíl temporal ---------- */
  .tl2-legend{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px;}
  .tl2-leg-item{ display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; padding:5px 11px; border-radius:20px; border:1.5px solid var(--panel-line); cursor:pointer; color:rgba(247,236,218,.75); transition:opacity .2s;}
  .tl2-leg-item.off{ opacity:.3;}
  .tl2-leg-item:focus-visible{ outline:2px solid var(--amber); outline-offset:1px;}
  .tl2-leg-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .tl2-axis{ position:relative; height:18px; margin:0 2px 2px;}
  .tl2-yr{ position:absolute; transform:translateX(-50%); font-size:9.5px; color:rgba(247,236,218,.4); font-weight:700;}
  .tl2-yr.now{ color:var(--amber);}
  .tl2-body{ position:relative; padding-top:4px;}
  .tl2-rlabel{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:rgba(247,236,218,.45); margin-bottom:8px;}
  .tl2-rail{ position:relative; height:10px; border-radius:6px; margin:0 2px; background:rgba(247,236,218,0.06);}
  .tl2-bars, .tl2-pins{ position:absolute; inset:0;}
  .tl2-bar{ position:absolute; top:0; height:100%; border-radius:6px; cursor:pointer; transition:filter .15s, transform .15s; outline:none;}
  .tl2-bar:hover, .tl2-bar.active, .tl2-bar:focus-visible{ filter:brightness(1.15); transform:scaleY(1.8); z-index:3;}
  .tl2-pin{ position:absolute; top:50%; transform:translate(-50%,-50%); width:13px; height:13px; border-radius:50%; border:2px solid var(--panel); cursor:pointer; transition:transform .15s; outline:none;}
  .tl2-pin:hover, .tl2-pin.active, .tl2-pin:focus-visible{ transform:translate(-50%,-50%) scale(1.6); z-index:3;}
  .tl2-gap{ height:20px;}
  .tl2-now{ position:absolute; top:0; bottom:0; width:1.5px; background:repeating-linear-gradient(180deg, var(--amber) 0 4px, transparent 4px 8px); opacity:.5;}
  .tl2-now span{ position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:8.5px; font-weight:800; color:var(--ink); background:var(--amber); padding:2px 6px; border-radius:6px; white-space:nowrap;}
  .tl2-hint{ font-size:11px; color:rgba(247,236,218,.4); text-align:center; margin-bottom:14px;}
  .tl2-detail{ background:rgba(247,236,218,0.04); border-radius:14px; margin-top:16px; max-height:0; overflow:hidden; transition:max-height .4s cubic-bezier(.16,1,.3,1); border:1px solid transparent;}
  .tl2-detail.show{ max-height:3000px; border-color:var(--panel-line);}
  .tl2-detail-in{ padding:16px 18px;}
  .tl2-d-badge{ display:inline-flex; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:4px 11px; border-radius:20px; margin-bottom:10px;}
  .tl2-d-title{ font-family:'Fraunces',serif; font-size:16px; font-weight:700; margin-bottom:3px;}
  .tl2-d-org{ font-size:12.5px; font-weight:600; margin-bottom:2px;}
  .tl2-d-date{ font-size:11px; color:rgba(247,236,218,.5); margin-bottom:10px;}
  .tl2-d-code{ font-size:11px; color:var(--amber-soft); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:5px;}
  .tl2-d-list{ margin:0; padding-left:16px; font-size:12.5px; line-height:1.6; color:rgba(247,236,218,.82);}
</style>
</head>
<body>

  <main class="scene-wrap">

  const hasHadBirthdayThisYear =
    (today.getMonth() > BIRTHDATE.getMonth()) ||

function initContactForm(){
  const form = document.getElementById('contactForm');
  if(!form || form.dataset.bound) return;
  form.dataset.bound = "1";
  const statusEl = document.getElementById('contactStatus');
  const submitBtn = document.getElementById('contactSubmit');
  const defaultStatus = statusEl.textContent;

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();

    if(WEB3FORMS_ACCESS_KEY === "PEGA_AQUI_TU_ACCESS_KEY"){
      statusEl.textContent = "⚠️ Falta configurar la clave de envío (WEB3FORMS_ACCESS_KEY en el código) — de momento el formulario no puede enviar de verdad.";

    submitBtn.disabled = true;

    statusEl.textContent = "Enviando tu mensaje…";

    const data = new FormData(form);
    data.append("access_key", WEB3FORMS_ACCESS_KEY);
    data.append("subject", `Nuevo mensaje desde el portfolio — ${data.get("motivo")}`);

        method: "POST",
        headers: { "Accept": "application/json" },

      const result = await res.json();
      if(result.success){

function initCompetencias(){
  const grid = document.getElementById('compGrid');
  if(!grid) return;
  const chipsEl = document.getElementById('compChips');
  const emptyEl = document.getElementById('compEmpty');

  chipsEl.innerHTML = `<span class="comp-chip active" data-cat="all" tabindex="0" role="button" aria-pressed="true">Todo</span>` +
    SKILL_GROUPS.map(g=>`<span class="comp-chip" data-cat="${g.label}" tabindex="0" role="button" aria-pressed="false">${g.icon} ${g.label.split(' ')[0]}</span>`).join('');

  grid.innerHTML = SKILL_GROUPS.map(g=>g.skills.map(s=>
    `<span class="comp-pill" style="background:${g.bg};color:${g.color}" data-cat="${g.label}" data-name="${s.n.toLowerCase()}" tabindex="0" role="button" aria-haspopup="dialog" aria-label="${s.n}, ver nivel de dominio">${s.n}</span>`
  ).join('')).join('');

  let cat='all', q='';
  function applyFilter(){
    let visible=0;
    grid.querySelectorAll('.comp-pill').forEach(p=>{
      const matchCat = cat==='all' || p.dataset.cat===cat;
      const matchQ = !q || p.dataset.name.includes(q);
      const show = matchCat && matchQ;
      p.classList.toggle('hide', !show);
      if(show) visible++;
    });
    emptyEl.style.display = visible ? 'none' : 'block';
  }
  document.getElementById('compSearch').addEventListener('input', e=>{ q=e.target.value.toLowerCase().trim(); applyFilter(); });

  function selectChip(chip){
    chipsEl.querySelectorAll('.comp-chip').forEach(c=>{ c.classList.remove('active'); c.setAttribute('aria-pressed','false'); });
    chip.classList.add('active'); chip.setAttribute('aria-pressed','true');
    cat = chip.dataset.cat; applyFilter();
  }
  chipsEl.addEventListener('click', e=>{ const chip=e.target.closest('.comp-chip'); if(chip) selectChip(chip); });
  chipsEl.addEventListener('keydown', e=>{ const chip=e.target.closest('.comp-chip'); if(chip && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); selectChip(chip); } });

  grid.querySelectorAll('.comp-pill').forEach(pill=>{
    const g = SKILL_GROUPS.find(gr=>gr.label===pill.dataset.cat);
    const s = g.skills.find(sk=>sk.n.toLowerCase()===pill.dataset.name);
    const open = ()=>openSkillPopup(g,s,pill);
    pill.addEventListener('click', open);
    pill.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  });
}

function openSkillPopup(g,s,trigger){
  sound.tick();
  popupLastTrigger = trigger;
  document.getElementById('popupIcon').textContent = g.icon;
  document.getElementById('popupBadge').style.background = g.bg;
  document.getElementById('popupBadge').style.color = g.color;
  document.getElementById('popupBadge').textContent = g.label;
  document.getElementById('popupTitle').textContent = s.n;
  document.getElementById('popupLvl').textContent = `${LVL_LABEL[s.lvl]} · ${s.lvl}/5`;
  document.getElementById('popupDesc').textContent = s.d;
  const starsEl = document.getElementById('popupStars');
  starsEl.innerHTML = '';
  for(let i=0;i<5;i++){ const sp=document.createElement('span'); sp.textContent='★'; starsEl.appendChild(sp); }

  // Contener el popup exactamente dentro de los límites visibles del panel abierto
  const modalRect = document.getElementById('modal').getBoundingClientRect();
  const pb = document.getElementById('popupBackdrop');
  pb.style.left = modalRect.left + 'px';
  pb.style.top = modalRect.top + 'px';
  pb.style.width = modalRect.width + 'px';
  pb.style.height = modalRect.height + 'px';
  pb.style.right = 'auto';
  pb.style.bottom = 'auto';

  pb.classList.add('open');
  document.getElementById('popupClose').focus();
  setTimeout(()=>{
    starsEl.querySelectorAll('span').forEach((star,i)=>{
      setTimeout(()=>{ star.style.opacity=1; star.style.transform='scale(1)'; if(i<s.lvl) star.classList.add('on'); }, i*70);
    });
  },80);
}
function closePopup(){
  sound.tick();
  document.getElementById('popupBackdrop').classList.remove('open');
  if(popupLastTrigger) popupLastTrigger.focus();
}
let popupLastTrigger = null;
document.getElementById('popupClose').addEventListener('click', closePopup);
document.getElementById('popupBackdrop').addEventListener('click', e=>{ if(e.target.id==='popupBackdrop') closePopup(); });
window.addEventListener('resize', ()=>{
  const pb = document.getElementById('popupBackdrop');
  if(pb.classList.contains('open')){
    const r = document.getElementById('modal').getBoundingClientRect();
    pb.style.left = r.left+'px'; pb.style.top = r.top+'px'; pb.style.width = r.width+'px'; pb.style.height = r.height+'px';
  }
});

function initExperiencia(){
  const barsEl = document.getElementById('tl2Bars');
  if(!barsEl) return;
  const pinsEl = document.getElementById('tl2Pins');
  const axEl = document.getElementById('tl2Axis');
  const legEl = document.getElementById('tl2Legend');
  const nowEl = document.getElementById('tl2Now');
  const detailEl = document.getElementById('tl2Detail');
  const detailIn = document.getElementById('tl2DetailIn');

  legEl.innerHTML = Object.entries(CATS2).map(([k,c])=>
    `<span class="tl2-leg-item" data-cat="${k}" tabindex="0" role="button" aria-pressed="true"><span class="tl2-leg-dot" style="background:${c.color}"></span>${c.label}</span>`
  ).join('');
  axEl.innerHTML = [2020,2021,2022,2023,2024,2025,2026].map(y=>
    `<span class="tl2-yr${y===2026?' now':''}" style="left:${pct2(y)}">${y}</span>`
  ).join('');
  nowEl.style.left = pct2(NOW_Y);

  barsEl.innerHTML = EXP.map(it=>{
    const c=CATS2[it.cat];
    const left=((it.s-S_Y)/R_Y*100), width=((it.e-it.s)/R_Y*100);
    return `<div class="tl2-bar" data-id="${it.id}" data-cat="${it.cat}" style="left:${left}%;width:${width}%;background:${c.color}" tabindex="0" role="button" aria-label="${it.title}, ${it.org}, ${it.date}"></div>`;
  }).join('');
  pinsEl.innerHTML = EDU.map(it=>{
    const c=CATS2[it.cat];
    return `<div class="tl2-pin" data-id="${it.id}" data-cat="${it.cat}" style="left:${pct2(it.y)};background:${c.color}" tabindex="0" role="button" aria-label="${it.title}, ${it.org}, ${it.date}"></div>`;
  }).join('');

  let activeId=null;
  function showDetail(item,cat,el,isExp){
    sound.tick();
    document.querySelectorAll('.tl2-bar.active,.tl2-pin.active').forEach(e=>e.classList.remove('active'));
    if(activeId===item.id){ activeId=null; detailEl.classList.remove('show'); return; }
    activeId=item.id; el.classList.add('active');
    const list=item.items.map(t=>`<li>${t}</li>`).join('');
    const codeHtml = item.code ? `<div class="tl2-d-code">🏷️ ${item.code}</div>` : '';
    const prefix = isExp ? 'Experiencia' : item.reg==='reglada' ? 'Formación reglada' : item.reg==='especializada' ? 'Formación especializada' : 'Formación no reglada';
    detailIn.innerHTML = `<span class="tl2-d-badge" style="background:${cat.color}22;color:${cat.color}">${prefix} · ${cat.label}</span><div class="tl2-d-title">${item.title}</div><div class="tl2-d-org" style="color:${cat.color}">${item.org}</div><div class="tl2-d-date">${item.date}</div>${codeHtml}<ul class="tl2-d-list">${list}</ul>`;
    detailEl.classList.add('show');
  }
  barsEl.querySelectorAll('.tl2-bar').forEach(bar=>{
    const item=EXP.find(i=>i.id===bar.dataset.id); const cat=CATS2[item.cat];
    const act=()=>showDetail(item,cat,bar,true);
    bar.addEventListener('click',act);
    bar.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
  });
  pinsEl.querySelectorAll('.tl2-pin').forEach(pin=>{
    const item=EDU.find(i=>i.id===pin.dataset.id); const cat=CATS2[item.cat];
    const act=()=>showDetail(item,cat,pin,false);
    pin.addEventListener('click',act);
    pin.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
  });

  let activeCats = new Set(Object.keys(CATS2));
  function applyFilter(){
    barsEl.querySelectorAll('.tl2-bar').forEach(b=>{ const on=activeCats.has(b.dataset.cat); b.style.opacity=on?'1':'.15'; b.style.pointerEvents=on?'auto':'none'; });
    pinsEl.querySelectorAll('.tl2-pin').forEach(p=>{ const on=activeCats.has(p.dataset.cat); p.style.opacity=on?'1':'.15'; p.style.pointerEvents=on?'auto':'none'; });
  }
  legEl.querySelectorAll('.tl2-leg-item').forEach(item=>{
    const toggle=()=>{
      const key=item.dataset.cat;
      if(activeCats.has(key)){ if(activeCats.size>1) activeCats.delete(key); } else activeCats.add(key);
      item.classList.toggle('off', !activeCats.has(key));
      item.setAttribute('aria-pressed', String(activeCats.has(key)));
      applyFilter();
    };
    item.addEventListener('click', toggle);
    item.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });
}

/* ============== SONIDO (sintetizado, sin archivos) ============== */
let soundOn = true;
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, duration, vol, type, offset, freqEnd){
  if(!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + (offset||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + duration);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}
const sound = {
  hover: () => tone(720, 0.10, 0.09, 'sine'),
  tick:  () => tone(900, 0.05, 0.05, 'square'),
  open:  () => { tone(520, 0.10, 0.13, 'sine'); tone(780, 0.13, 0.11, 'sine', 0.05); },
  close: () => { tone(600, 0.09, 0.11, 'sine'); tone(420, 0.12, 0.09, 'sine', 0.04); },
};

const bgMusic = document.getElementById('bgMusic');
const soundToggle = document.getElementById('soundToggle');

function refreshSoundUI(){
  soundToggle.classList.toggle('on', soundOn);
  soundToggle.setAttribute('aria-pressed', String(soundOn));
  soundToggle.textContent = soundOn ? '🔊' : '🔈';
  soundToggle.setAttribute('aria-label', soundOn ? 'Silenciar sonido y música' : 'Activar sonido y música de fondo');
}
function startAudio(){
  ensureAudioCtx();
  bgMusic.volume = 0.16;
  bgMusic.play().catch(()=>{ /* el navegador aún no ha dado permiso, se reintentará con la próxima interacción */ });
}
refreshSoundUI(); // el sonido empieza activado; sonará en cuanto el navegador lo permita (ver abajo)

// Los navegadores exigen una interacción real antes de reproducir audio.
// En cuanto la persona haga clic, toque o pulse una tecla por primera vez, arrancamos música y sonidos automáticamente.
function unlockOnFirstGesture(){
  if(soundOn) startAudio();
  document.removeEventListener('pointerdown', unlockOnFirstGesture);
  document.removeEventListener('keydown', unlockOnFirstGesture);
}
document.addEventListener('pointerdown', unlockOnFirstGesture, { once:true });
document.addEventListener('keydown', unlockOnFirstGesture, { once:true });

soundToggle.addEventListener('click', () => {
  soundOn = !soundOn;
  refreshSoundUI();
  if(soundOn){
    startAudio();
    sound.open();
  } else {
    bgMusic.pause();
  }
});

/* ============== HOTSPOTS ============== */
const hotspots = document.querySelectorAll('.hotspot');
const holes = document.querySelectorAll('.hole');
const labels = document.querySelectorAll('.room-label');

function setActive(room){
  holes.forEach(h => h.style.opacity = (h.dataset.room === room) ? '1' : '0');
  labels.forEach(l => l.classList.toggle('visible', l.dataset.room === room));
}
function clearActive(){
  holes.forEach(h => h.style.opacity = '0');
  labels.forEach(l => l.classList.remove('visible'));
}

hotspots.forEach(el=>{
  const room = el.dataset.room;
  el.addEventListener('mouseenter', ()=> { setActive(room); sound.hover(); });
  el.addEventListener('mouseleave', ()=> clearActive());
  el.addEventListener('focus', ()=> { setActive(room); sound.hover(); });
  el.addEventListener('blur', ()=> clearActive());
  el.addEventListener('click', ()=> { sound.open(); openModal(room, el); });
  el.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); sound.open(); openModal(room, el); }
  });
});

document.querySelectorAll('.legend button').forEach(btn=>{
  btn.addEventListener('click', ()=> { sound.open(); openModal(btn.dataset.room, btn); });
});

document.getElementById('quickContact').addEventListener('click', function(){
  sound.open();
  openModal('contacto', this);
});

const backdrop = document.getElementById('backdrop');
const modalContent = document.getElementById('modalContent');
const modalClose = document.getElementById('modalClose');
let lastFocused = null;

function openModal(room, triggerEl){
  const data = CONTENT[room];
  if(!data) return;
  lastFocused = triggerEl;
  modalContent.innerHTML = `<h2 id="modal-title">${data.title}</h2>${data.body}`;
  document.getElementById('modal').classList.toggle('wide', ['valores','competencias','experiencia'].includes(room));
  document.getElementById('modal').classList.toggle('tall', room === 'competencias');
  backdrop.classList.add('open');
  modalClose.focus();
  document.addEventListener('keydown', onKeydown);
  if(room==='valores') initValores();
  if(room==='competencias') initCompetencias();
  if(room==='experiencia') initExperiencia();
  if(room==='portada') initEdad();
  if(room==='contacto') initContactForm();
}
function closeModal(){
  sound.close();
  backdrop.classList.remove('open');
  document.removeEventListener('keydown', onKeydown);
  if(lastFocused) lastFocused.focus();
}
function getFocusable(container){
  return Array.from(container.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(el => el.offsetParent !== null);
}
function trapFocus(e, container){
  if(e.key !== 'Tab') return;
  const focusable = getFocusable(container);
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function onKeydown(e){
  const popupOpen = document.getElementById('popupBackdrop').classList.contains('open');
  if(e.key === 'Escape'){
    if(popupOpen){ closePopup(); }
    else { closeModal(); }
    return;
  }
  trapFocus(e, popupOpen ? document.getElementById('popup') : document.getElementById('modal'));
}
modalClose.addEventListener('click', closeModal);
backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeModal(); });
</script>
